<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171225" media="(prefers-color-scheme: dark)">
<meta name="description" content="基準周波数を選び、脳波帯ボタンをタップ。左右の周波数差によるバイノーラルビート。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バイノーラル">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<title>バイノーラルビート</title>
<style>
  html{color-scheme:light dark;-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}

  :root{
    --bg:#efeaf7;
    --panel:#fbf9ff;
    --ink:#2c2442;
    --muted:#786e92;
    --sub:#b0863a;
    --pink:#c65f97;
    --line:rgba(44,36,66,.14);
    --glow:rgba(140,100,200,.13);
    --warn-bg:#f5ecd7;
    --warn-ink:#87641f;
    --radius:16px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#171225;
      --panel:#221b39;
      --ink:#e9e3f5;
      --muted:#9b8fbb;
      --sub:#e0bd72;
      --pink:#ea7fb2;
      --line:rgba(233,227,245,.15);
      --glow:rgba(146,108,224,.20);
      --warn-bg:#2f2614;
      --warn-ink:#e5b877;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171225;
    --panel:#221b39;
    --ink:#e9e3f5;
    --muted:#9b8fbb;
    --sub:#e0bd72;
    --pink:#ea7fb2;
    --line:rgba(233,227,245,.15);
    --glow:rgba(146,108,224,.20);
    --warn-bg:#2f2614;
    --warn-ink:#e5b877;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }

  .aura{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(85% 55% at 50% 0%, var(--glow), transparent 72%),
      radial-gradient(70% 50% at 88% 108%, var(--glow), transparent 70%);
  }

  .wrap{
    position:relative;z-index:1;
    max-width:460px;margin:0 auto;
    min-height:100dvh;
    padding:clamp(16px,4vh,30px) 18px 24px;
    display:flex;flex-direction:column;gap:11px;
  }

  header{display:flex;flex-direction:column;gap:4px;text-align:center;align-items:center;margin-bottom:2px}
  h1{
    margin:0;
    font-family:"Fraunces",Georgia,serif;
    font-weight:500;
    font-size:clamp(26px,7.2vw,32px);
    letter-spacing:.02em;
    color:var(--pink);
  }
  .sub{font-size:13.5px;color:var(--sub);font-weight:500;line-height:1.6;max-width:24em}

  .warn{
    display:flex;gap:9px;align-items:flex-start;
    background:var(--warn-bg);color:var(--warn-ink);
    border-radius:var(--radius);padding:10px 14px;
    font-size:12.5px;line-height:1.55;font-weight:500;
  }
  .warn .ic{flex:none;font-size:15px;line-height:1.4}

  .ctrl{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:9px 15px 8px;
    display:flex;flex-direction:column;gap:3px;
  }
  .ctrl-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12.5px;color:var(--muted);
  }
  .stepper{display:flex;align-items:center;gap:5px}
  .step{
    appearance:none;flex:none;width:26px;height:26px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--ink);
    font-family:inherit;font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;transition:transform .06s, background .15s;
  }
  .step:active{transform:scale(.92)}
  .step:hover{background:var(--line)}
  #baseNum{
    width:2.9em;border:none;background:transparent;color:var(--ink);
    font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:500;
    text-align:right;font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;padding:2px 0;
  }
  #baseNum::-webkit-outer-spin-button,#baseNum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #baseNum:focus{outline:none;box-shadow:0 2px 0 var(--sub)}
  .stepper .su{font-size:11px;color:var(--muted);margin:0 3px 0 1px}
  .ctrl input[type="range"]{
    width:100%;height:24px;background:transparent;cursor:pointer;
  }
  #base{accent-color:var(--sub)}
  #vol{accent-color:var(--ink)}
  .ctrl-scale{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .ctrl.vol{padding:7px 15px}
  .ctrl.vol .row{display:flex;align-items:center;gap:12px}
  .ctrl.vol .ic{color:var(--muted);font-size:16px;flex:none}

  .nowplaying{
    text-align:center;font-size:12.5px;font-weight:500;color:var(--sub);
    background:var(--panel);border:1.5px solid var(--line);
    border-radius:var(--radius);padding:9px 12px;
    font-variant-numeric:tabular-nums;
  }

  .bands{display:flex;flex-direction:column;gap:7px}
  .band{
    position:relative;appearance:none;
    border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:var(--radius);
    padding:11px 14px;
    display:flex;align-items:center;gap:12px;
    cursor:pointer;font-family:inherit;text-align:left;
    touch-action:manipulation;overflow:hidden;
    transition:border-color .25s, box-shadow .3s, transform .06s;
  }
  .band::before{
    content:"";position:absolute;inset:0;background:var(--hue);opacity:0;
    transition:opacity .3s;pointer-events:none;
  }
  .band:active{transform:scale(.985)}
  .band > *{position:relative;z-index:1}
  .glyph{
    flex:none;width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Fraunces",Georgia,serif;font-size:21px;font-style:italic;
    color:var(--hue);border:1.5px solid var(--hue);
  }
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .name{
    font-size:15px;font-weight:700;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .beat{
    font-family:"Fraunces",Georgia,serif;font-style:italic;
    font-size:11.5px;font-weight:500;color:var(--hue);
  }
  .desc{font-size:11.5px;color:var(--muted);line-height:1.45}
  .ind{
    flex:none;width:8px;height:8px;border-radius:50%;background:var(--line);
    transition:background .3s;
  }

  .band[aria-pressed="true"]{
    border-color:var(--hue);
    box-shadow:0 0 0 1px var(--hue), 0 8px 26px -8px var(--hue);
  }
  .band[aria-pressed="true"]::before{opacity:.11}
  .band[aria-pressed="true"] .glyph{background:var(--hue);border-color:var(--hue);color:#1c1730}
  .band[aria-pressed="true"] .ind{background:var(--hue);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .band[aria-pressed="true"] .ind{animation:none;opacity:.9}
  }

  .band:focus-visible,.stop:focus-visible,.ctrl input:focus-visible{
    outline:2px solid var(--ink);outline-offset:3px;
  }

  .stop{
    appearance:none;border:1.5px solid var(--ink);
    background:transparent;color:var(--ink);
    border-radius:var(--radius);
    padding:14px;font-family:inherit;font-weight:700;font-size:16px;
    width:100%;cursor:pointer;touch-action:manipulation;
    transition:transform .06s;
  }
  .stop:active{transform:scale(.985)}

  .hint{
    margin:4px 0 0;font-size:10.5px;line-height:1.55;color:var(--muted);
    text-align:center;text-wrap:balance;
  }

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
</style>
</head>
<body>

<div class="aura" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>バイノーラルビート</h1>
    <p class="sub">基準周波数を選び、脳波帯のボタンをタップ。<br>左右の周波数差で、その状態へと誘います。</p>
  </header>

  <div class="warn">
    <span class="ic" aria-hidden="true">🎧</span>
    <span>イヤホン・ヘッドホン必須です。左右が分かれて初めて効果が出ます。スピーカーでは意味がありません。</span>
  </div>

  <div class="ctrl">
    <div class="ctrl-head">
      <span>基準周波数（左耳の音）</span>
      <span class="stepper">
        <button type="button" class="step" id="baseMinus" aria-label="1Hz下げる">−</button>
        <input type="number" id="baseNum" min="150" max="400" step="1" value="200" inputmode="numeric" autocomplete="off" aria-label="基準周波数（ヘルツ）">
        <span class="su">Hz</span>
        <button type="button" class="step" id="basePlus" aria-label="1Hz上げる">＋</button>
      </span>
    </div>
    <input type="range" id="base" min="150" max="400" step="1" value="200" autocomplete="off" aria-label="基準周波数（150から400ヘルツ）">
    <div class="ctrl-scale"><span>150</span><span>275</span><span>400</span></div>
  </div>

  <div class="ctrl vol">
    <div class="row">
      <span class="ic" aria-hidden="true">🔉</span>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5" autocomplete="off" aria-label="音量">
      <span class="ic" aria-hidden="true">🔊</span>
    </div>
  </div>

  <div class="nowplaying" id="nowPlaying" hidden></div>

  <div class="bands" id="bands"></div>

  <button class="stop" id="stopBtn" hidden>止める</button>

  <p class="hint">
    再生中は画面が消えないようにします（画面ロックすると音は止まります）。<br>
    ※ 周波数やバイノーラルビートの健康効果は科学的に確認されていません。リラックス用としてお楽しみください。
  </p>
</div>

<p class="sr-only" id="sr" aria-live="polite"></p>

<script>
(function(){
  "use strict";

  var BANDS = [
    {key:"delta", g:"δ", name:"デルタ波", off:3,  desc:"深い睡眠、身体のヒーリング、無意識",              hue:"#9d8ae0"},
    {key:"theta", g:"θ", name:"シータ波", off:6,  desc:"深い瞑想、変性意識（体外離脱など）、直感", hue:"#4fbbb8"},
    {key:"alpha", g:"α", name:"アルファ波", off:9,  desc:"リラックス、軽い瞑想、集中力の土台",             hue:"#5fc47f"},
    {key:"beta",  g:"β", name:"ベータ波", off:21, desc:"通常の覚醒状態、論理的思考、アクティブな集中",     hue:"#e6ba5f"},
    {key:"gamma", g:"γ", name:"ガンマ波", off:45, desc:"高度な認知処理、ひらめき、統合的な気づき",         hue:"#ec7a9c"}
  ];

  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null;
  var current = null;   // { src, gain, band } または null
  var wakeLock = null;

  var VOLKEY = "binaural.vol", BASEKEY = "binaural.base";

  var vol = 0.5;
  try{ var sv = parseFloat(localStorage.getItem(VOLKEY)); if(sv >= 0 && sv <= 1) vol = sv; }catch(e){}
  var baseFreq = 200;
  try{ var sb = parseInt(localStorage.getItem(BASEKEY), 10); if(sb >= 150 && sb <= 400) baseFreq = sb; }catch(e){}

  var bandsEl   = document.getElementById("bands");
  var baseEl    = document.getElementById("base");
  var baseNumEl = document.getElementById("baseNum");
  var baseMinus = document.getElementById("baseMinus");
  var basePlus  = document.getElementById("basePlus");
  var volEl     = document.getElementById("vol");
  var stopBtn   = document.getElementById("stopBtn");
  var nowEl     = document.getElementById("nowPlaying");
  var srEl      = document.getElementById("sr");

  baseEl.value    = String(baseFreq);
  baseNumEl.value = String(baseFreq);
  volEl.value     = String(vol);

  /* ---- audio ---- */
  function ensureCtx(){
    if(!AC) return;
    if(!ctx){
      try{ ctx = new AC({latencyHint:"playback"}); }
      catch(e){ ctx = new AC(); }
      master = ctx.createGain();
      master.gain.value = vol * 0.7;
      master.connect(ctx.destination);
    }
    if(ctx.state === "suspended") ctx.resume();
  }

  // 整数Hzなら1秒ぶんで左右とも整数周期 → 継ぎ目なくループ
  function toneBuffer(base, off){
    var sr = ctx.sampleRate;
    var len = Math.round(sr);
    var buf = ctx.createBuffer(2, len, sr);
    var L = buf.getChannelData(0), R = buf.getChannelData(1);
    var wl = 2 * Math.PI * base / sr;
    var wr = 2 * Math.PI * (base + off) / sr;
    for(var i = 0; i < len; i++){
      L[i] = Math.sin(wl * i);
      R[i] = Math.sin(wr * i);
    }
    return buf;
  }

  function fadeTo(param, target, dur){
    var now = ctx.currentTime;
    param.cancelScheduledValues(now);
    param.setValueAtTime(param.value, now);
    param.linearRampToValueAtTime(target, now + dur);
  }

  function makeVoice(off){
    var t = ctx.currentTime + 0.03;
    var src = ctx.createBufferSource();
    src.buffer = toneBuffer(baseFreq, off);
    src.loop = true;
    var g = ctx.createGain();
    g.gain.value = 0;
    src.connect(g);
    g.connect(master);
    src.start(t);
    return {src:src, gain:g};
  }
  function killVoice(v, rel){
    if(!v || !ctx) return;
    var now = ctx.currentTime;
    var p = v.gain.gain;
    p.cancelScheduledValues(now);
    p.setValueAtTime(p.value, now);
    p.linearRampToValueAtTime(0, now + rel);
    var s = v.src, g = v.gain;
    try{ s.stop(now + rel + 0.05); }catch(e){}
    setTimeout(function(){ try{ s.disconnect(); g.disconnect(); }catch(e){} }, (rel + 0.3) * 1000);
  }

  function playBand(band){
    ensureCtx();
    if(!ctx) return;
    var v = makeVoice(band.off);
    v.band = band;
    fadeTo(v.gain.gain, 0.92, 0.25);
    if(current) killVoice(current, 0.25);
    current = v;
    requestWake();
    srEl.textContent = band.name + " 再生中";
  }
  function retune(){
    if(!current || !ctx) return;
    var v = makeVoice(current.band.off);
    v.band = current.band;
    fadeTo(v.gain.gain, 0.92, 0.16);
    killVoice(current, 0.16);
    current = v;
  }
  function stopAll(){
    if(current){ killVoice(current, 0.22); current = null; }
    releaseWake();
    srEl.textContent = "停止しました";
  }
  function toggleBand(band){
    if(current && current.band.key === band.key){
      stopAll();
      setActive(null);
    }else{
      playBand(band);
      setActive(band);
    }
  }

  function setVol(v){
    vol = v;
    try{ localStorage.setItem(VOLKEY, String(v)); }catch(e){}
    if(master && ctx) fadeTo(master.gain, vol * 0.7, 0.08);
  }

  /* ---- wake lock ---- */
  function requestWake(){
    try{
      if("wakeLock" in navigator && !wakeLock){
        navigator.wakeLock.request("screen").then(function(w){
          wakeLock = w;
          w.addEventListener("release", function(){ wakeLock = null; });
        }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWake(){
    try{ if(wakeLock) wakeLock.release(); }catch(e){}
    wakeLock = null;
  }

  /* ---- UI ---- */
  var bandEls = {};
  BANDS.forEach(function(band){
    var b = document.createElement("button");
    b.className = "band";
    b.dataset.key = band.key;
    b.style.setProperty("--hue", band.hue);
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", band.name + " うなり プラス" + band.off + "ヘルツ。" + band.desc);
    b.innerHTML =
      '<span class="glyph" aria-hidden="true">' + band.g + '</span>' +
      '<span class="body">' +
        '<span class="name">' + band.name + ' <span class="beat">うなり +' + band.off + 'Hz</span></span>' +
        '<span class="desc">' + band.desc + '</span>' +
      '</span>' +
      '<span class="ind" aria-hidden="true"></span>';
    b.addEventListener("click", function(){ toggleBand(band); });
    bandsEl.appendChild(b);
    bandEls[band.key] = b;
  });

  function updateNowPlaying(){
    if(current){
      var off = current.band.off;
      nowEl.textContent =
        "左 " + baseFreq + "Hz ／ 右 " + (baseFreq + off) + "Hz ・ うなり " + off + "Hz（" + current.band.name + "）";
      nowEl.hidden = false;
    }else{
      nowEl.hidden = true;
    }
  }
  function setActive(band){
    BANDS.forEach(function(b){
      bandEls[b.key].setAttribute("aria-pressed", (band && band.key === b.key) ? "true" : "false");
    });
    stopBtn.hidden = !band;
    updateNowPlaying();
  }

  // 基準周波数：スライダー／数値入力／−＋ボタンを同期。src を除いた要素だけ更新して入力の邪魔をしない
  function setBase(v, src){
    var n = Math.round(v);
    if(isNaN(n)) return;
    n = Math.max(150, Math.min(400, n));
    baseFreq = n;
    if(src !== "slider") baseEl.value = String(n);
    if(src !== "num") baseNumEl.value = String(n);
    try{ localStorage.setItem(BASEKEY, String(n)); }catch(e){}
    updateNowPlaying();
    clearTimeout(baseEl._t);
    baseEl._t = setTimeout(retune, 120);
  }
  baseEl.addEventListener("input", function(){ setBase(parseInt(baseEl.value, 10), "slider"); });
  baseNumEl.addEventListener("input", function(){
    var raw = parseInt(baseNumEl.value, 10);
    if(!isNaN(raw) && raw >= 150 && raw <= 400) setBase(raw, "num");
  });
  baseNumEl.addEventListener("blur", function(){
    var v = parseInt(baseNumEl.value, 10);
    if(!isNaN(v)) setBase(v); else baseNumEl.value = String(baseFreq);
  });
  baseNumEl.addEventListener("keydown", function(e){ if(e.key === "Enter") baseNumEl.blur(); });

  // −／＋ ボタン：タップで1Hz、長押しで連続
  function nudge(delta){ setBase(baseFreq + delta); }
  function holdRepeat(btn, fn){
    var to, iv;
    function start(e){ e.preventDefault(); fn(); to = setTimeout(function(){ iv = setInterval(fn, 70); }, 420); }
    function stop(){ clearTimeout(to); clearInterval(iv); }
    btn.addEventListener("pointerdown", start);
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ btn.addEventListener(ev, stop); });
  }
  holdRepeat(baseMinus, function(){ nudge(-1); });
  holdRepeat(basePlus,  function(){ nudge(1); });

  volEl.addEventListener("input", function(){ setVol(parseFloat(volEl.value)); });
  stopBtn.addEventListener("click", function(){ stopAll(); setActive(null); });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      if(ctx && ctx.state === "suspended") ctx.resume();
      if(current) requestWake();
    }
  });
})();
</script>
</body>
</html>
